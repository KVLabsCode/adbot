<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- antenna -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="3.5" r="1.5" fill="#fbbf24"/>
  <!-- head -->
  <rect x="8" y="8" width="16" height="12" rx="3" fill="#fff"/>
  <!-- eyes -->
  <circle cx="12.5" cy="14" r="2" fill="#6366f1"/>
  <circle cx="19.5" cy="14" r="2" fill="#6366f1"/>
  <!-- eye shine -->
  <circle cx="13.2" cy="13.3" r="0.6" fill="#fff"/>
  <circle cx="20.2" cy="13.3" r="0.6" fill="#fff"/>
  <!-- mouth -->
  <rect x="12" y="17" width="8" height="1.5" rx="0.75" fill="#c4b5fd"/>
  <!-- body -->
  <rect x="10" y="22" width="12" height="6" rx="2" fill="#fff"/>
  <!-- body detail -->
  <rect x="13" y="24" width="6" height="2" rx="1" fill="#c4b5fd"/>
  <!-- ears -->
  <rect x="5" y="11" width="2.5" height="6" rx="1.25" fill="#fff"/>
  <rect x="24.5" y="11" width="2.5" height="6" rx="1.25" fill="#fff"/>
</svg>
