<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#EAF7F2"/>
  <!-- Body -->
  <rect x="120" y="80" width="160" height="120" rx="20" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <!-- Screen -->
  <rect x="145" y="95" width="110" height="70" rx="8" fill="#10B981" opacity="0.06" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="200" y="130" text-anchor="middle" fill="#10B981" font-size="10" font-family="system-ui" opacity="0.5">16:9</text>
  <text x="200" y="145" text-anchor="middle" fill="#10B981" font-size="8" font-family="system-ui" opacity="0.4">DISPLAY</text>
  <!-- Top sensor dome -->
  <ellipse cx="200" cy="80" rx="30" ry="15" fill="#10B981" opacity="0.08" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="200" cy="73" r="5" fill="#10B981" opacity="0.3"/>
  <!-- Wheels -->
  <circle cx="155" cy="215" r="18" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <circle cx="155" cy="215" r="7" fill="#10B981" opacity="0.15"/>
  <circle cx="245" cy="215" r="18" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>
  <circle cx="245" cy="215" r="7" fill="#10B981" opacity="0.15"/>
  <!-- Axle -->
  <rect x="140" y="200" width="120" height="15" rx="4" fill="#10B981" opacity="0.06" stroke="#10B981" stroke-width="1.5"/>
  <!-- Signal waves -->
  <path d="M280 90 Q295 80 280 70" stroke="#10B981" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M290 95 Q310 80 290 65" stroke="#10B981" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>
  <!-- Route dots -->
  <circle cx="90" cy="260" r="4" fill="#10B981" opacity="0.3"/>
  <circle cx="130" cy="255" r="3" fill="#10B981" opacity="0.25"/>
  <line x1="94" y1="258" x2="127" y2="256" stroke="#10B981" stroke-width="1" stroke-dasharray="3 2" opacity="0.2"/>
  <circle cx="200" cy="250" r="3" fill="#10B981" opacity="0.25"/>
  <line x1="133" y1="255" x2="197" y2="251" stroke="#10B981" stroke-width="1" stroke-dasharray="3 2" opacity="0.2"/>
  <circle cx="270" cy="255" r="3" fill="#10B981" opacity="0.25"/>
  <line x1="203" y1="251" x2="267" y2="254" stroke="#10B981" stroke-width="1" stroke-dasharray="3 2" opacity="0.2"/>
  <circle cx="310" cy="260" r="4" fill="#10B981" opacity="0.3"/>
  <line x1="273" y1="256" x2="306" y2="259" stroke="#10B981" stroke-width="1" stroke-dasharray="3 2" opacity="0.2"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" fill="#10B981" font-size="10" font-family="system-ui" font-weight="600" opacity="0.6">STARSHIP / COCO / SERVE / OTTONOMY</text>
</svg>
