<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#FDF6EE"/>
  <!-- Body - tall service robot -->
  <rect x="155" y="60" width="90" height="150" rx="16" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="2"/>
  <!-- Head / face area -->
  <circle cx="200" cy="85" r="22" fill="#F59E0B" opacity="0.08" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="192" cy="82" r="4" fill="#F59E0B" opacity="0.4"/>
  <circle cx="208" cy="82" r="4" fill="#F59E0B" opacity="0.4"/>
  <path d="M193 93 Q200 97 207 93" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.35"/>
  <!-- Screen -->
  <rect x="170" y="115" width="60" height="60" rx="6" fill="#F59E0B" opacity="0.06" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="200" y="145" text-anchor="middle" fill="#F59E0B" font-size="10" font-family="system-ui" opacity="0.5">1:1</text>
  <text x="200" y="160" text-anchor="middle" fill="#F59E0B" font-size="8" font-family="system-ui" opacity="0.4">DISPLAY</text>
  <!-- Tray -->
  <rect x="140" y="185" width="120" height="8" rx="4" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Base -->
  <ellipse cx="200" cy="225" rx="50" ry="12" fill="#F59E0B" opacity="0.08" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Proximity waves -->
  <path d="M120 140 Q105 150 120 160" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M110 135 Q90 150 110 165" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.15" stroke-linecap="round"/>
  <path d="M280 140 Q295 150 280 160" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M290 135 Q310 150 290 165" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.15" stroke-linecap="round"/>
  <!-- Floor grid (retail floor) -->
  <line x1="80" y1="260" x2="320" y2="260" stroke="#F59E0B" stroke-width="0.5" opacity="0.15"/>
  <line x1="80" y1="275" x2="320" y2="275" stroke="#F59E0B" stroke-width="0.5" opacity="0.1"/>
  <line x1="120" y1="245" x2="120" y2="290" stroke="#F59E0B" stroke-width="0.5" opacity="0.1"/>
  <line x1="200" y1="245" x2="200" y2="290" stroke="#F59E0B" stroke-width="0.5" opacity="0.1"/>
  <line x1="280" y1="245" x2="280" y2="290" stroke="#F59E0B" stroke-width="0.5" opacity="0.1"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" fill="#F59E0B" font-size="11" font-family="system-ui" font-weight="600" opacity="0.6">KEENON / PUDU RETAIL</text>
</svg>
